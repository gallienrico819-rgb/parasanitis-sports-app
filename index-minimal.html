
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parasanitis - App Atleti</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { navy: { 900: '#0f2b5c' }, medical: { accent: '#2b82c9' } },
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-white text-slate-900 font-sans antialiased min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md">
        <!-- Minimal Header -->
        <div class="text-center mb-8">
            <div class="w-12 h-12 bg-sky-50 text-medical-accent rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-inner">
                <i data-lucide="heart-pulse" class="w-6 h-6"></i>
            </div>
            <h1 class="text-xl font-bold text-navy-900">Parasanitis Sport</h1>
            <p class="text-xs text-slate-500 mt-1">Registra il tuo profilo in pochi secondi</p>
        </div>

        <!-- Clean Form Card -->
        <form class="space-y-4" onsubmit="event.preventDefault(); alert('Salvato!');">
            
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1.5">Società Sportiva</label>
                <select required class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3.5 text-xs font-medium focus:outline-none focus:border-navy-900">
                    <option value="" disabled selected>Seleziona la tua squadra...</option>
                    <option value="bulciago">A.C. Bulciago Calcio</option>
                    <option value="sirone">Basket Sirone 1984</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1.5">Nome e Cognome</label>
                <input type="text" placeholder="Nome dell'atleta" required class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3.5 text-xs font-medium focus:outline-none focus:border-navy-900">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1.5">Data di Nascita</label>
                    <input type="date" required class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3.5 text-xs font-medium focus:outline-none focus:border-navy-900">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1.5">WhatsApp</label>
                    <input type="tel" placeholder="+39..." required class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3.5 text-xs font-medium focus:outline-none focus:border-navy-900">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1.5">Scadenza Certificato Medico</label>
                <input type="date" required class="w-full bg-sky-50/50 border border-sky-200 rounded-2xl px-4 py-3.5 text-xs font-bold text-navy-900 focus:outline-none">
            </div>

            <button type="submit" class="w-full py-4 bg-medical-accent hover:bg-navy-900 text-white rounded-2xl font-bold text-xs uppercase tracking-wider transition-all shadow-md">
                Procedi
            </button>
        </form>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parasanitis - Area Sanitaria Sportiva</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 900: '#0f2b5c', 950: '#0a1a38' },
                        medical: { accent: '#2b82c9' }
                    },
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Container -->
    <div class="w-full max-w-lg bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        
        <!-- Clinical Header -->
        <div class="bg-navy-900 p-6 text-white border-b-4 border-medical-accent">
            <div class="flex items-center justify-between mb-2">
                <span class="text-[10px] font-bold uppercase tracking-widest text-medical-accent bg-white/10 px-2.5 py-1 rounded-md">Protocollo Ufficiale</span>
                <i data-lucide="shield-check" class="w-5 h-5 text-medical-accent"></i>
            </div>
            <h1 class="text-xl font-bold tracking-tight">Poliambulatorio Parasanitis</h1>
            <p class="text-xs text-slate-300 mt-1">Gestione Certificati Medici e Anagrafica Sportiva</p>
        </div>

        <!-- Form -->
        <form class="p-6 space-y-4" onsubmit="event.preventDefault(); alert('Registrazione clinica salvata.');">
            
            <div>
                <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Società Sportiva di Appartenenza *</label>
                <select required class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2.5 text-xs font-medium focus:outline-none focus:border-navy-900">
                    <option value="" disabled selected>Seleziona società...</option>
                    <option value="bulciago">A.C. Bulciago Calcio</option>
                    <option value="sirone">Basket Sirone 1984</option>
                    <option value="lecco">Volley Lecco Youth</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Nome e Cognome Atleta *</label>
                <input type="text" placeholder="Nome completo" required class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2.5 text-xs font-medium focus:outline-none focus:border-navy-900">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Data di Nascita *</label>
                    <input type="date" required class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2.5 text-xs font-medium focus:outline-none focus:border-navy-900">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Telefono (WhatsApp) *</label>
                    <input type="tel" placeholder="+39..." required class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2.5 text-xs font-medium focus:outline-none focus:border-navy-900">
                </div>
            </div>

            <div class="p-4 bg-slate-50 rounded-xl border border-slate-200">
                <label class="block text-xs font-bold uppercase text-navy-900 mb-1">Scadenza Certificato Medico Sportivo *</label>
                <p class="text-[11px] text-slate-500 mb-2">Promemoria automatico WhatsApp attivo a -30 giorni.</p>
                <input type="date" required class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-xs font-bold text-slate-900 focus:outline-none">
            </div>

            <button type="submit" class="w-full py-3 bg-navy-900 hover:bg-navy-950 text-white rounded-lg font-bold text-xs uppercase tracking-wider transition-all shadow-sm">
                Conferma Registrazione
            </button>
        </form>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>

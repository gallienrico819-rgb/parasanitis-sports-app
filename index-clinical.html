<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parasanitis - Clinico</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-6">
        <h1 class="text-xl font-bold text-slate-900 mb-4">Poliambulatorio Parasanitis</h1>
        <form class="space-y-4" onsubmit="event.preventDefault(); alert('Salvato!');">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Società Sportiva *</label>
                <select required class="w-full border rounded-lg p-2.5 text-sm">
                    <option value="">Seleziona...</option>
                    <option value="1">A.C. Bulciago Calcio</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Nome Atleta *</label>
                <input type="text" required class="w-full border rounded-lg p-2.5 text-sm" placeholder="Nome e Cognome">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Data di Nascita *</label>
                <input type="date" required class="w-full border rounded-lg p-2.5 text-sm">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Telefono WhatsApp *</label>
                <input type="tel" required class="w-full border rounded-lg p-2.5 text-sm" placeholder="+39...">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Scadenza Certificato *</label>
                <input type="date" required class="w-full border rounded-lg p-2.5 text-sm">
            </div>
            <button type="submit" class="w-full bg-blue-900 text-white p-3 rounded-lg font-bold text-sm">Conferma</button>
        </form>
    </div>
</body>
</html>

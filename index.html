<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parasanitis Sports App - Onboarding</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 900: '#0f2b5c', 950: '#0a1a38' },
                        medical: { light: '#68a6e0', accent: '#2b82c9' }
                    },
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4">

    <!-- App Card Container -->
    <div class="w-full max-w-md bg-white text-slate-900 rounded-3xl shadow-2xl overflow-hidden border border-slate-100">
        
        <!-- Header -->
        <div class="bg-navy-950 p-6 text-center text-white relative">
            <div class="w-12 h-12 bg-medical-accent/20 rounded-2xl flex items-center justify-center mx-auto mb-3 border border-medical-light/30">
                <i data-lucide="trophy" class="w-6 h-6 text-medical-light"></i>
            </div>
            <h1 class="text-xl font-extrabold tracking-tight">Parasanitis Sports Network</h1>
            <p class="text-xs text-slate-400 mt-1">Connect your sports club & manage medical compliance</p>
        </div>

        <!-- Form Body -->
        <form class="p-6 space-y-4" onsubmit="event.preventDefault(); alert('Registration saved successfully! Automated certificate tracking active.');">
            
            <!-- 1. Select Sports Club -->
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5 flex items-center gap-1.5">
                    <i data-lucide="shield" class="w-3.5 h-3.5 text-medical-accent"></i> 1. Select Sports Club *
                </label>
                <select required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs font-medium focus:outline-none focus:border-navy-900 text-slate-800">
                    <option value="" disabled selected>Choose your club...</option>
                    <option value="bulciago_calcio">A.C. Bulciago Calcio</option>
                    <option value="sirone_basket">Basket Sirone 1984</option>
                    <option value="lecco_volley">Volley Lecco Youth</option>
                    <option value="brianza_athletics">Atletica Brianza</option>
                </select>
            </div>

            <!-- 2. Full Name -->
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5 flex items-center gap-1.5">
                    <i data-lucide="user" class="w-3.5 h-3.5 text-medical-accent"></i> 2. Athlete Full Name *
                </label>
                <input type="text" placeholder="e.g. Marco Rossi" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs font-medium focus:outline-none focus:border-navy-900 text-slate-800">
            </div>

            <!-- 3. Date of Birth -->
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5 flex items-center gap-1.5">
                    <i data-lucide="calendar" class="w-3.5 h-3.5 text-medical-accent"></i> 3. Date of Birth *
                </label>
                <input type="date" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs font-medium focus:outline-none focus:border-navy-900 text-slate-800">
            </div>

            <!-- 4. Phone Number (WhatsApp) -->
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5 flex items-center gap-1.5">
                    <i data-lucide="phone" class="w-3.5 h-3.5 text-medical-accent"></i> 4. Phone Number (for WhatsApp Alerts) *
                </label>
                <input type="tel" placeholder="+39 333 123 4567" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs font-medium focus:outline-none focus:border-navy-900 text-slate-800">
            </div>

            <!-- 5. Medical Certificate Expiry -->
            <div class="p-3.5 bg-amber-50 rounded-2xl border border-amber-200">
                <label class="block text-xs font-bold uppercase tracking-wider text-amber-900 mb-1 flex items-center gap-1.5">
                    <i data-lucide="file-badge-2" class="w-4 h-4 text-amber-600"></i> 5. Sports Medical Cert. Expiry *
                </label>
                <p class="text-[11px] text-amber-700 mb-2">We will automatically send a WhatsApp booking reminder 30 days prior to expiry.</p>
                <input type="date" required class="w-full bg-white border border-amber-300 rounded-xl px-3.5 py-2.5 text-xs font-bold text-slate-900 focus:outline-none">
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full py-3.5 bg-navy-900 hover:bg-navy-950 text-white rounded-xl font-bold text-xs uppercase tracking-wider transition-all shadow-md flex items-center justify-center gap-2">
                <span>Complete Registration</span>
                <i data-lucide="arrow-right" class="w-4 h-4 text-medical-light"></i>
            </button>
        </form>

        <div class="p-3 bg-slate-50 border-t border-slate-100 text-center text-[10px] text-slate-400">
            Powered by Poliambulatorio Parasanitis Medical Network
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
